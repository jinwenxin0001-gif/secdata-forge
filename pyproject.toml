[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secdata-forge"
version = "0.1.0"
description = "A small toolkit for auditable security dataset preparation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "jinwenxin0001-gif" }
]
keywords = [
  "cybersecurity",
  "data-quality",
  "dataset",
  "drift-detection",
  "data-cleaning",
  "label-quality"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.scripts]
secdata-forge = "secdata_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
